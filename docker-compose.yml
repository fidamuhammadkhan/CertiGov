services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certigov
      POSTGRES_USER: certigov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password in your .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certigov -d certigov"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://certigov:${POSTGRES_PASSWORD}@db:5432/certigov
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      CERT_SIGNING_KEY: ${CERT_SIGNING_KEY:?Set CERT_SIGNING_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set HTTPS public URL}
      DATA_DIR: /srv/app/data
      PRODUCTION: "true"
    volumes:
      - app_data:/srv/app/data
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres_data:
  app_data:
